<!doctype html>
<html lang="pt-BR" data-ui="v2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rodada ao Vivo</title>
  <meta name="description" content="Placar em tempo real da rodada do Brasileirão Série A, com tabela ao vivo, simulador e estatísticas. Versão 2 do visual.">
  <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rodada">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://site.api.espn.com" crossorigin>
  <link rel="preconnect" href="https://a.espncdn.com">
  <!-- As fontes não seguram a primeira pintura: a página aparece com a fonte do sistema e troca quando chegam. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"></noscript>
  <!-- A v2 aproveita o CSS da versão atual (janelas de detalhe, avisos, status) e redesenha o resto por cima. -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
  <link rel="modulepreload" href="../js/app.js">
  <link rel="modulepreload" href="../js/espn.js">
  <link rel="modulepreload" href="../js/rounds.js">
  <link rel="modulepreload" href="../js/table.js">
  <link rel="modulepreload" href="../js/insights.js">
  <link rel="modulepreload" href="../js/sim.js">
  <link rel="modulepreload" href="../js/secador.js">
  <link rel="modulepreload" href="../js/season.js">
  <link rel="modulepreload" href="../js/fx.js">
  <link rel="modulepreload" href="../js/ui.js">
  <link rel="modulepreload" href="../js/ui-v2.js">
  <link rel="modulepreload" href="../js/util.js">
</head>
<body>
  <header class="v2-head">
    <div class="v2-top">
      <span class="league">Brasileirão <span id="season"></span></span>
      <div class="band-actions">
        <button id="sound" class="icon-btn" type="button" aria-pressed="false" aria-label="Som de gol desligado">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button id="refresh" class="refresh" type="button" aria-label="Atualizar agora">
          <span id="pulse" class="pulse" hidden></span>
          <span id="updated" class="updated"><b>Carregando…</b></span>
          <svg class="refresh-icon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <nav class="v2-round" aria-label="Rodadas">
      <div class="round-title">
        <h1 id="round-name">Rodada</h1>
        <p id="round-dates" class="round-dates">&nbsp;</p>
      </div>
      <button id="prev" class="v2-arrow" type="button" aria-label="Rodada anterior" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="next" class="v2-arrow" type="button" aria-label="Próxima rodada" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </header>

  <main>
    <section id="view-jogos" data-tab="jogos" role="tabpanel" aria-labelledby="tab-jogos">
      <div id="fav"></div>
      <div id="secador"></div>
      <div id="others"></div>
      <div id="news"></div>
      <p id="summary" class="summary" hidden></p>
      <div id="matches" class="matches">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <div id="fav-hint"></div>
      <div class="share-row">
        <button id="share" class="share" type="button" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4l4 4M5 13v6h14v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Compartilhar placares
        </button>
      </div>
    </section>
    <section id="view-tabela" data-tab="tabela" role="tabpanel" aria-labelledby="tab-tabela" hidden>
      <p id="table-note" class="table-note"></p>
      <div id="table-wrap" class="table-wrap"></div>
      <ul id="legend" class="legend"></ul>
      <div id="table-check"></div>
    </section>
    <section id="view-simular" data-tab="simular" role="tabpanel" aria-labelledby="tab-simular" hidden>
      <div id="sim" class="sim"></div>
    </section>
    <section id="view-numeros" data-tab="numeros" role="tabpanel" aria-labelledby="tab-numeros" hidden>
      <div id="stats"></div>
    </section>
    <div id="error" class="error" role="alert" hidden>
      <p id="error-text"></p>
      <button id="retry" type="button">Tentar de novo</button>
    </div>
  </main>

  <footer class="foot">
    Dados da ESPN. Atualiza sozinho a cada 30&nbsp;s durante os jogos.
    <button id="diag" type="button" class="link" data-action="diag">Status dos dados</button>
    <a class="link" href="../">Ver a versão atual do app</a>
  </footer>

  <!-- Abas embaixo, ao alcance do polegar. -->
  <nav class="v2-tabbar" role="tablist" aria-label="Seções">
    <button class="tab" role="tab" data-tab="jogos" aria-selected="true" aria-controls="view-jogos" id="tab-jogos" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.8 2.8-1.5 4.4H9.7l-1.5-4.4z" fill="currentColor" stroke="none"/></svg>Jogos
    </button>
    <button class="tab" role="tab" data-tab="tabela" aria-selected="false" aria-controls="view-tabela" id="tab-tabela" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h1M4 12h1M4 18h1" stroke-width="2.6"/></svg>Tabela
    </button>
    <button class="tab" role="tab" data-tab="simular" aria-selected="false" aria-controls="view-simular" id="tab-simular" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Simular
    </button>
    <button class="tab" role="tab" data-tab="numeros" aria-selected="false" aria-controls="view-numeros" id="tab-numeros" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Números
    </button>
  </nav>

  <dialog id="sheet" class="sheet" aria-label="Detalhes">
    <div class="sheet-bar">
      <button id="sheet-back" class="icon-btn" type="button" aria-label="Voltar" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="grip" aria-hidden="true"></span>
      <button id="sheet-close" class="icon-btn" type="button" aria-label="Fechar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-scroll"><div id="sheet-body"></div></div>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
